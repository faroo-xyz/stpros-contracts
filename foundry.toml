# Native verification profile. Run only inside the approved isolated export.
# Canonical artifact identity is independently enforced by tools/ci/canonical.py.
[profile.default]
src = "contracts"
test = "test"
out = "out"
cache_path = "cache_forge"
# forge test clears its cheatcode-snapshot directory on start; keep it away from
# the tracked B0 baselines in snapshots/.
snapshots = "cache_forge/snapshots"
libs = ["lib"]
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
ffi = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
  "forge-std/=lib/forge-std/src/",
]
# Legacy fixtures (recorded deployment bytecode) and deployed-state snapshots are read-only inputs.
fs_permissions = [
  { access = "read", path = "./cache/native-r4" },
  { access = "read-write", path = "./cache_forge/rehearsal" },
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "./snapshots/deployed" },
  # Bounded test coverage output inside the isolated export only.
  { access = "read-write", path = "./cache_forge/invariant-coverage" },
]
extra_output = ["storageLayout"]

[profile.final]
optimizer = true
optimizer_runs = 200

# Batch 02 development baseline only; later high-strength campaigns are separate.
[profile.final.invariant]
runs = 256
depth = 32
fail_on_revert = true
show_metrics = true
